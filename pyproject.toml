[project]
name = "empi"
version = "2026.5.1"
description = "Backend for the Empirical research CMS"
authors = [{ name = "David Krchňavý", email = "krchnavy11@uniba.sk" }]
readme = "README.md"
requires-python = "^3.14"
dependencies = [
	"django (~=6.1.0)",
	"django-cors-headers (~=4.9.0)",
	"djangorestframework (~=3.18.0)",
	"pycryptodome (~=3.23.0)",
	"python-magic (~=0.4.0)",
	"django-rest-knox (~=5.1.0)",
	"psycopg[binary] (~=3.3.0)",
	"gunicorn (~=26.1.0)",
	"nanoid (~=2.0.0)",
	"html2text (~=2025.4.15)",
	"drf-spectacular (~=0.30.0)",
	"sentry-sdk[django] (~=2.68.0)",
	"markdown (~=3.10.0)",
	"djangorestframework-stubs (>=3.18.0,<4.0.0)"
]

[tool.poetry]
package-mode = false

[project.urls]
"Homepage" = "https://gitea.znamafirma.xyz/znamafirma/empi"
"Bug Tracker" = "https://gitea.znamafirma.xyz/znamafirma/empi/issues"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
